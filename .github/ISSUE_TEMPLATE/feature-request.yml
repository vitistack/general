name: Feature request
description: Request an enhancement for Vitistack
labels: ["Request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: solution
      description: Describe the solution you'd like to see implemented.
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternative-behavior
    attributes:
      label: Alternative behavior
      description: Describe alternatives you've considered
      placeholder: A cleare and concise description og any alternative solutions or features you've considered.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Additional context 
      placeholder: Add any other context or screenshots about the feature request here.
    validations:
      required: true
